name: Release

# A tag vX.Y.Z builds the installers on Windows, Linux and macOS and publishes
# the GitHub release. The in-app updater (src-tauri/src/update.rs) looks for
# these v* tags.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          # 22.04 on purpose: an AppImage built here runs on every distribution
          # with a glibc as old as Ubuntu 22.04's.
          - { name: Linux, os: ubuntu-22.04 }
          - { name: macOS-arm64, os: macos-latest }
          - { name: macOS-x64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-cargo-${{ matrix.os }}-

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends             libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev libdbus-1-dev             libasound2-dev libpulse-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev             libxdo-dev patchelf rpm

      - name: Install dependencies
        run: npm ci

      # Three files carry the version: a "0.1.1" that installs a 0.1.0 is the
      # kind of thing nobody notices until a bug report arrives.
      - name: Check the tag and every version agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}" -replace '^v', ''
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          $bad = @()
          if ($tag -ne $conf)  { $bad += "tauri.conf.json says $conf" }
          if ($tag -ne $pkg)   { $bad += "package.json says $pkg" }
          if ($tag -ne $cargo) { $bad += "Cargo.toml says $cargo" }
          if ($bad) { throw "tag says $tag but $($bad -join '; ')" }

      - name: Build and pack the installers
        run: npm run pack

      - uses: actions/upload-artifact@v7
        with:
          name: Tobi-${{ matrix.name }}
          path: release/*
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      # Both the versioned names (the updater picks these) and the plain ones
      # (README links to /releases/latest/download/Tobi-Windows-setup.exe).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          ls -la release
          cat > notes.md <<EOF
          Tobi $v for Windows 10/11, Linux and macOS.

          **Windows:** download \`Tobi-Windows-setup.exe\`. The installer is unsigned, so SmartScreen shows a warning: More info, then Run anyway.

          **Linux:** \`Tobi-Linux-x86_64.AppImage\` (make it executable and run it), or the \`.deb\` / \`.rpm\`.

          **macOS:** \`Tobi-macOS-aarch64.dmg\` (Apple silicon) or \`Tobi-macOS-x86_64.dmg\` (Intel). The app is ad-hoc signed, not notarized: after copying it to Applications, run \`xattr -dr com.apple.quarantine /Applications/Tobi.app\` once, or right-click and choose Open.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* --repo "$REPO" --title "Tobi $v" --notes-file notes.md
